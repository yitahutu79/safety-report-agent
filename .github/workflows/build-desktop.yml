name: Build desktop distributions

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
          - os: ubuntu-24.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Linux WebView build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libglib2.0-0 libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libgdk-pixbuf-2.0-0 libgtk-3-0 libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2
      - name: Install desktop dependencies
        run: python -m pip install -r requirements-desktop.txt pytest
      - name: Run automated checks
        run: python -m pytest
      - name: Build native desktop package
        run: python tools/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: safety-report-agent-${{ matrix.artifact }}
          path: |
            dist/安全设施设计报告工作台-v0.9.0-*.zip
            dist/交付包-v0.9.0-*.tar.gz
            dist/*.sha256
          if-no-files-found: error
